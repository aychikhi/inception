secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aychikhi/data/wordpress

  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aychikhi/data/mariadb
  portainer_data:
    driver: local

networks:
  inception:
    driver: bridge

services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    image: mariadb
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    image: wordpress
    restart: always
    volumes:
      - wordpress:/var/www/wordpress
    secrets:
      - db_password
      - credentials
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    image: nginx
    restart: always
    volumes:
      - wordpress:/var/www/wordpress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "443:443"

  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    image: redis
    restart: always
    networks:
      - inception

  ftp:
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    image: ftp
    restart: always
    volumes:
      - wordpress:/var/www/wordpress
    secrets:
      - credentials
    networks:
      - inception
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    depends_on:
      - wordpress

  static:
    build:
      context: requirements/bonus/static
      dockerfile: Dockerfile
    container_name: static
    image: static
    restart: always
    networks:
      - inception
    ports:
      - "8081:80"

  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    image: adminer
    restart: always
    networks:
      - inception
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

  portainer:
    build:
      context: requirements/bonus/portainer
      dockerfile: Dockerfile
    container_name: portainer
    image: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - inception
