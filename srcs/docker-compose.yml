# docker-compose.yml
# Version is not needed in modern Docker Compose (v2+)

# ============================================================
# SECRETS
# Docker reads these files and mounts them inside containers
# at /run/secrets/<secret_name>
# ============================================================
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

# ============================================================
# VOLUMES
# Named volumes that persist data on the host machine
# Data is stored at /home/yourlogin/data/
# ============================================================
volumes:
  redis:
    driver: local

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  portainer_data:
    driver: local

# ============================================================
# NETWORKS
# Private network that all containers share
# Containers talk to each other using service names as hostnames
# ============================================================
networks:
  inception:
    driver: bridge

# ============================================================
# SERVICES
# Each service = one container
# ============================================================
services:

  # ----------------------------------------------------------
  # MARIADB — The Database
  # ----------------------------------------------------------
  mariadb:
    # Build from our Dockerfile
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile

    # Container name (also its hostname on the Docker network)
    container_name: mariadb

    # Image name (must match service name per subject)
    image: mariadb

    # Restart automatically if container crashes
    restart: always

    # Mount the mariadb volume at the data directory
    volumes:
      - mariadb:/var/lib/mysql

    # Which secrets this container can access
    # They appear as files at /run/secrets/
    secrets:
      - db_password
      - db_root_password

    # Environment variables from .env file
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}

    # Connect to the inception network
    networks:
      - inception

    # Health check — Docker will check if MariaDB is running
    # Other containers can use 'depends_on' with condition
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # WORDPRESS — The Website + PHP Engine
  # ----------------------------------------------------------
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile

    container_name: wordpress
    image: wordpress

    restart: always

    # Mount the wordpress volume at the WP files directory
    volumes:
      - wordpress:/var/www/wordpress

    secrets:
      - db_password
      - credentials

    # Environment variables WordPress startup script needs
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}

    networks:
      - inception

    # WordPress DEPENDS on MariaDB being healthy before starting
    # This prevents WordPress from trying to install before DB is ready
    depends_on:
      mariadb:
        condition: service_healthy

  # ----------------------------------------------------------
  # NGINX — The Front Door
  # ----------------------------------------------------------
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile

    container_name: nginx
    image: nginx

    restart: always

    # Mount wordpress volume so NGINX can serve static files directly
    # (images, CSS, JS don't need to go through PHP)
    volumes:
      - wordpress:/var/www/wordpress

    # NGINX needs the domain name to configure the server_name
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}

    networks:
      - inception

    # NGINX depends on WordPress being up
    depends_on:
      - wordpress

    # Port mapping: host:container
    # This is the ONLY port exposed to the outside world
    # All traffic enters through port 443 (HTTPS)
    ports:
      - "443:443"

  # ----------------------------------------------------------
  # REDIS — WordPress Object Cache
  # ----------------------------------------------------------
  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    image: redis
    restart: always
    networks:
      - inception
    # Redis doesn't need to be exposed outside
    # WordPress connects to it internally

  # ----------------------------------------------------------
  # FTP — File Transfer Server
  # ----------------------------------------------------------
  ftp:
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    image: ftp
    restart: always
    # FTP needs access to WordPress files
    volumes:
      - wordpress:/var/www/wordpress
    secrets:
      - credentials
    networks:
      - inception
    # Expose FTP ports to outside
    # 21 = command port
    # 21100-21110 = passive mode data ports
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    depends_on:
      - wordpress

  # ----------------------------------------------------------
  # STATIC — Portfolio/Showcase Website
  # ----------------------------------------------------------
  static:
    build:
      context: requirements/bonus/static
      dockerfile: Dockerfile
    container_name: static
    image: static
    restart: always
    networks:
      - inception
    # Expose on port 8081 to avoid conflicts
    ports:
      - "8081:80"

  # ----------------------------------------------------------
  # ADMINER — Database GUI
  # ----------------------------------------------------------
  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    image: adminer
    restart: always
    networks:
      - inception
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

  portainer:
    build:
      context: requirements/bonus/portainer
      dockerfile: Dockerfile
    container_name: portainer
    image: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - inception