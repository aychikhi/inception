server {
    # Listen on port 80 (plain HTTP - static site doesn't need HTTPS)
    listen 80;
    listen [::]:80;

    server_name _;

    # Where the HTML files are
    root /var/www/static;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access logs (not needed for a static site)
    access_log off;
}