# vsftpd Configuration

# Allow local system users to log in
local_enable=YES

# Allow file uploads
write_enable=YES

# Run in standalone mode (not via inetd)
listen=YES
listen_ipv6=NO

# Don't allow anonymous connections
anonymous_enable=NO

# Chroot users to their home directory
# This confines them to /var/www/wordpress
chroot_local_user=YES

# Required when chroot is enabled
allow_writeable_chroot=YES

# Passive mode settings
# Passive FTP works better through NAT/firewalls
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# The directory FTP users land in
local_root=/var/www/wordpress

# Show file owner as ftp user
hide_ids=YES

# Secure chroot jail directory
secure_chroot_dir=/var/run/vsftpd/empty

# Use local time
use_localtime=YES

# Log connections
xferlog_enable=YES