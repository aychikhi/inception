# Redis Configuration for WordPress Cache

# Listen on all interfaces so WordPress container can connect
bind 0.0.0.0
protected-mode no

# Default Redis port
port 6379

# Don't run as daemon (required for Docker foreground)
daemonize no

# Maximum memory Redis can use
# After this limit, old cached items are removed automatically
maxmemory 256mb

# When memory is full, remove least recently used items
# This is perfect for a cache
maxmemory-policy allkeys-lru

# Save data to disk periodically (optional for cache, but good practice)
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Log level
loglevel notice

# Log to stdout (Docker captures this)
logfile ""