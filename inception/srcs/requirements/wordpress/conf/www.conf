[www]

; The user and group that PHP-FPM runs as
; Must match the owner of WordPress files
user  = www-data
group = www-data

; Listen on all interfaces on port 9000
; This is how NGINX sends requests to us
; 0.0.0.0 means accept from any container on the network
listen = 0.0.0.0:9000

; Who is allowed to connect to this socket
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process management - how PHP-FPM manages worker processes
; dynamic = number of workers adjusts based on load
pm = dynamic

; Maximum number of child processes
pm.max_children = 5

; Number of processes to start when PHP-FPM starts
pm.start_servers = 2

; Minimum number of idle processes
pm.min_spare_servers = 1

; Maximum number of idle processes
pm.max_spare_servers = 3

; Log errors to stderr (Docker captures this in logs)
php_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Important: clear environment so PHP can read Docker env vars
clear_env = no